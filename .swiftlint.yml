# A deliberately small rule set. The code base has long, heavily commented files by
# design (see docs/DESIGN.md), so the size and naming rules are off; this catches
# the mechanical problems and leaves style to review.
included:
  - TimeMoney
  - Shared
  - TimeMoneyWidget
  - TimeMoneyTests

disabled_rules:
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - function_parameter_count
  - large_tuple
  - identifier_name
  - type_name
  - nesting
  - force_cast
  - force_try
  - force_unwrapping
  - todo
  - trailing_comma
  - opening_brace

opt_in_rules:
  - empty_count
  - unused_import
  - redundant_nil_coalescing
