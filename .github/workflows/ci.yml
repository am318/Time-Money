name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so runner-image or toolchain drift shows up on its own rather than on
  # the next unrelated pull request.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: command -v swiftlint >/dev/null || brew install swiftlint

      - name: Lint
        # Warnings are reported but do not fail the build; errors do. The rule set is
        # deliberately small (see .swiftlint.yml).
        run: swiftlint lint --reporter github-actions-logging

  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pinned, so a new runner default does not change the toolchain under us.
      # Matches the Xcode the README asks for.
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-${{ runner.os }}-xcode16.4-${{ hashFiles('TimeMoney.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: |
            derived-data-${{ runner.os }}-xcode16.4-${{ hashFiles('TimeMoney.xcodeproj/project.pbxproj') }}-
            derived-data-${{ runner.os }}-xcode16.4-

      - name: Pick an iPhone simulator
        id: sim
        run: |
          # First available iPhone, whatever the runner image ships.
          name=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9A-Za-z ]+ \(' | head -1 | sed 's/ ($//')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Using $name"

      - name: Build and test (unsigned)
        run: |
          xcodebuild test \
            -project TimeMoney.xcodeproj \
            -scheme TimeMoney \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
